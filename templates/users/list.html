{% extends 'base.html' %}
{% block title %}User List{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Users</h1>
<a href="{{ url_for('home.show_create_form') }}" class="bg-blue-500 text-white px-4 py-2 rounded">Add User</a>
<ul class="mt-4">
  {% for user in users %}
    <li class="mb-2">
      <span>{{ user.name }} ({{ user.email }})</span>
      <a href="{{ url_for('home.show_edit_form', user_id=user.id) }}" class="text-blue-600 ml-2">Edit</a>

      <form action="{{url_for('home.handle_delete_form',user_id=user.id)}}" method="post">

        <button type="submit">Delete</button>
      </form>
     

    </li>
  {% endfor %}
</ul>
{% endblock %}
